<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WritePretty</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       Ambient Background
       ========================= -->

  <div class="ambient-background"></div>


  <!-- =========================
       Hero
       ========================= -->

  <section class="hero">
    <div class="container">
      <h1>
        Clean your text. Keep your words.
        <br>
        Make it pretty.
      </h1>

      <p>
        A simple rule-based text cleanup tool that improves consistency and readability.
      </p>
    </div>
  </section>


  <!-- =========================
       Editor
       ========================= -->

  <section class="editor-section">
    <div class="container editor-layout">

      <!-- Original text input and spelling highlight layer. -->
      <div class="text-panel original-panel">
        <div class="monitor-screen">
          <div class="panel-header">
            <h2>Original</h2>
          </div>

          <div class="editor-wrapper">
            <div id="highlightLayer"></div>

            <textarea
              id="inputText"
              placeholder="Paste your text here..."
              spellcheck="false"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Displays the cleaned text, copy action, and attached history tabs. -->
      <div class="processed-history-shell">

        <div class="text-panel processed-panel">
          <div class="monitor-screen">
            <div class="panel-header">
              <h2>Pretty</h2>

              <div class="panel-actions">
                <button
                  id="historyToggleButton"
                  type="button"
                  aria-pressed="false"
                >
                  History
                </button>

                <button id="downloadButton" type="button" disabled>
                  Download
                </button>

                <button id="copyButton" type="button">
                  Copy
                </button>
              </div>
            </div>

            <textarea
              id="outputText"
              placeholder="Your cleaned text will appear here..."
              readonly
            ></textarea>
          </div>
        </div>

        <!-- Vertical tabs for stored text entries. -->
        <aside class="history-tabs hidden" aria-label="Text history">

          <!-- History entry tabs are created by JavaScript. -->
          <div id="historyTabList"></div>

          <button
            id="newHistoryButton"
            class="history-tab history-add-button"
            type="button"
            aria-label="Create new history entry"
          >
            +
          </button>

          <button
            id="combineHistoryButton"
            class="history-tab history-combine-button"
            type="button"
            aria-label="Show combined history"
          >
            ⊕
          </button>

        </aside>

      </div>

    </div>
  </section>


  <!-- =========================
       Footer
       ========================= -->

  <footer>
    <p>
      Local processing · No AI rewriting · Your words stay yours
    </p>
  </footer>


  <!-- =========================
       Scripts
       ========================= -->

  <!-- Typo.js provides the spell-checking functions used by script.js. -->
  <script src="libraries/typo.js"></script>
  <script src="script.js"></script>

</body>

</html>

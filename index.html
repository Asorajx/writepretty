<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WritePretty</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       Ambient Background
       ========================= -->

  <div class="ambient-background"></div>


  <!-- =========================
       Hero
       ========================= -->

  <section class="hero">
    <div class="container">
      <h1>
        Keep your words. Make it pretty.
      </h1>

      <p>
        A simple rule-based text cleanup tool that improves consistency and readability.
      </p>
    </div>
  </section>


  <!-- =========================
       Editor
       ========================= -->

  <section class="editor-section">
    <div class="container editor-layout">

      <!-- Original text input -->
      <div class="original-editor-shell">

        <!-- Toolbar for processing settings and user guidance -->
        <div class="original-toolbar">

          <div class="panel-actions">
            <button
              id="controlsButton"
              type="button"
            >
              Controls
            </button>

            <button
              id="helpButton"
              type="button"
            >
              Help
            </button>
          </div>

        </div>

        <div class="text-panel original-panel">
          <div class="monitor-screen">

            <div class="panel-header">
              <h2>Original</h2>
            </div>

            <div id="editorView">
              <div class="editor-wrapper">
                <textarea
                  id="inputText"
                  placeholder="Paste your text here..."
                  spellcheck="true"
                ></textarea>
              </div>
            </div>

            <div id="controlsView" class="hidden">

              <div class="controls-group">
                <h4>Cleanup</h4>
                <label
                  id="extraSpacesControl"
                  class="control-option active"
                >
                  <span class="control-box"></span>
                  <span>Spaces</span>
                </label>
                <label
                  id="punctuationControl"
                  class="control-option active"
                >
                  <span class="control-box"></span>
                  <span>Punctuation</span>
                </label>
                <label
                  id="capitalisationControl"
                  class="control-option active"
                >
                  <span class="control-box"></span>
                  <span>Capitalisation</span>
                </label>
              </div>

              <div class="controls-group">
                <h4>Markdown</h4>
                <label
                  id="headingControl"
                  class="control-option"
                >
                  <span class="control-box"></span>
                  <span>Headings (#)</span>
                </label>
                <label
                  id="bulletControl"
                  class="control-option"
                >
                  <span class="control-box"></span>
                  <span>Bullets (-)</span>
                </label>
                <label
                  id="emphasisControl"
                  class="control-option"
                >
                  <span class="control-box"></span>
                  <span>Emphasis (*)</span>
                </label>
              </div>

              <button
                id="controlsSaveButton"
                type="button"
              >
                Save
              </button>

            </div>

          </div>
        </div>

      </div>

      <!-- Displays the cleaned text, copy action, and attached history tabs -->
      <div class="processed-history-shell">

        <!-- Toolbar for processed-text information and actions -->
        <div class="pretty-toolbar">

          <div class="text-stats">
            <span id="wordCount">0 words</span>
            <span class="stat-separator">·</span>
            <span id="characterCount">0 characters</span>
          </div>

          <div class="panel-actions">
            <button
              id="historyToggleButton"
              type="button"
              aria-pressed="false"
            >
              History
            </button>

            <button id="downloadButton" type="button" disabled>
              Download
            </button>

            <button id="copyButton" type="button">
              Copy
            </button>
          </div>

        </div>

        <div class="text-panel processed-panel">
          <div class="monitor-screen">

            <div class="panel-header">
              <h2>Pretty</h2>
            </div>

            <textarea
              id="outputText"
              placeholder="Your cleaned text will appear here..."
              readonly
            ></textarea>

          </div>
        </div>

        <!-- Vertical tabs for stored text entries -->
        <aside class="history-tabs hidden" aria-label="Text history">

          <!-- History entry tabs are created by JavaScript -->
          <div id="historyTabList"></div>

          <button
            id="newHistoryButton"
            class="history-tab history-add-button"
            type="button"
            aria-label="Create new history entry"
          >
            +
          </button>

          <button
            id="combineHistoryButton"
            class="history-tab history-combine-button"
            type="button"
            aria-label="Show combined history"
          >
            ⊕
          </button>

        </aside>

      </div>

    </div>
  </section>


  <!-- =========================
       Footer
       ========================= -->

  <footer>
    <p>
      Local processing · No AI rewriting · Your words stay yours
    </p>
  </footer>


  <!-- =========================
       Scripts
       ========================= -->

  <!-- Main application logic -->
  <script src="script.js"></script>

</body>

</html>
